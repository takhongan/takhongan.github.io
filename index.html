<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Collection</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- 背景の動的アニメーション -->
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- メインコンテンツ -->
    <main class="main-container">
        <header class="header reveal">
            <h1 class="page-title">Apps Collection</h1>
        </header>

        <section class="app-grid">
            <!-- アプリ 1: Sleep Sounds Tracker -->
            <a href="https://sway.cloud.microsoft/qrEGcA0xYDvW6BwY?ref=Link" target="_blank" rel="noopener noreferrer"
                class="app-card reveal" style="transition-delay: 100ms;">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="app-icon" style="background: transparent; padding: 0;">
                        <img src="assets/skeepsoungtracker.jpg" alt=" Sleep Sounds Tracker"
                            style="width: 100%; height: 100%; border-radius: 16px; object-fit: cover;">
                    </div>
                    <h2 class="app-title">Sleep Sounds Tracker</h2>
                    <p class="app-description">
                        睡眠中の音を記録・解析し、より良い睡眠環境の構築をサポートするトラッカーアプリです。
                    </p>
                    <span class="app-link-text">詳細を見る &rarr;</span>
                </div>
            </a>

            <!-- アプリ 2: かんたん議事録AI -->
            <a href="https://takhongan.github.io/easymeeting/" target="_blank" rel="noopener noreferrer"
                class="app-card reveal" style="transition-delay: 200ms;">
                <div class="card-glow"></div>
                <div class="card-content">
                    <div class="app-icon" style="background: transparent; padding: 0;">
                        <img src="assets/easymeeting.png" alt="かんたん議事録AI"
                            style="width: 100%; height: 100%; border-radius: 16px; object-fit: cover;">
                    </div>
                    <h2 class="app-title">かんたん議事録AI</h2>
                    <p class="app-description">
                        音声を録音するだけで、AIが内容を要約・決定事項・TODOリストまで自動で整理・作成します。
                    </p>
                    <span class="app-link-text">詳細を見る &rarr;</span>
                </div>
            </a>
        </section>
    </main>

    <footer class="index-footer">
        <p>&copy; 2026 Takayoshi Hongan. All rights reserved.</p>
    </footer>

    <script>
        // フェードインアニメーションの初期化
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => {
                    el.classList.add('active');
                });
            }, 100);
        });
    </script>
</body>

</html>
